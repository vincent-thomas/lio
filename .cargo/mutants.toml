# cargo-mutants: change lio's core bookkeeping one mutation at a time and
# check that some test fails. Backends, the DS simulator and the C FFI are
# left out: their behavior depends on the platform they run on, and their
# own tests run there.
examine_globs = [
  "lio/src/slab.rs",
  "lio/src/registration.rs",
  "lio/src/lio.rs",
  "lio/src/backend/store.rs",
  "lio/src/backend/testing.rs",
  "lio/src/time.rs",
  "lio/src/time/clock.rs",
  "lio/src/api/io.rs",
  "lio/src/api/op.rs",
]
exclude_re = [
  # Profiling counters have no observable effect on the driver.
  "LioProfile",
  # TICK_MS is 1, so multiplying and dividing by it are the same.
  "replace \\* with / in ticks_duration",
  # The generation sits above bit 32 and the slot below, so `|` and `^`
  # pack the same key.
  "replace \\| with \\^ in SlabKey::as_u64",
  # Only called for a slot past the end, so the length never equals it.
  "replace > with >= in Clock::grow_timer_slots",
  # At the current tick the loop body changes nothing: the next busy tick
  # is always later (short of tick 2^64, some 584 million years in).
  "replace < with <= in Clock::advance_to",
  # An equal deadline is handled by the arm before.
  "replace < with <= in Clock::increment_active_deadline",
  # A timer exactly one level's range away lands in the slot the clock just
  # passed, which next comes round at its deadline rounded down to that
  # level's granularity: when the next level up would hand it down too.
  "replace < with <= in Clock::insert_timer",
  "replace < with <= in Clock::insert_higher_timer",
  # `CompletionFlags::MORE` is `1 << 0`, and `1 >> 0` is the same value.
  "lio/src/api/op\\.rs:80:33: replace << with >>",
]
test_tool = "nextest"
# Each mutant builds and runs these only: the core suites, which drive the
# scripted backend. The real-backend integration suites barely touch the
# core and would make up most of every mutant's build and run. (Cargo args
# reach both the build and the test step; test args only the test step.)
additional_cargo_args = ["--lib", "--test", "cancellation", "--test", "capacity"]
# A mutant can turn a loop infinite. nextest stops a hung test after 60s
# (`.config/nextest.toml`); this whole-run timeout is only the backstop.
timeout_multiplier = 3.0
minimum_test_timeout = 120
