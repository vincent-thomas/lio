[tools]
rust = [
  { version = "1.94.1", profile = "minimal", components = "clippy,rust-src,rustfmt" },
  { version = "nightly", profile = "minimal", components = "miri,rust-src" },
]
"cargo:cargo-deny" = "latest"
"cargo:cargo-mutants" = "latest"
cmake = "3.28.3"
jq = "1.7.1"

[tasks.lint]
run = [
  "cargo fmt --check",
  "cargo check --all-features",
  "cargo clippy --all-features",
  "cargo deny check"
]

[tasks.cbuild]
run = "cargo rustc -p lio --crate-type dylib,staticlib --features unstable_ffi --release"
