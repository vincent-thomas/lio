[tools]
rust = [
  { version = "1.100.0", profile = "minimal", components = "clippy,rust-src,rustfmt" },
  { version = "nightly", profile = "minimal", components = "miri,rust-src" },
]
# The cargo: tools below install prebuilt binaries through this.
# Without it they compile from source.
cargo-binstall = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-mutants" = "latest"
cmake = "3.28.3"
jq = "1.7.1"
"conda:libclang" = { version = "18.1.3", os = ["linux"] }
# C++ compiler for the FFI tests. conda clang 18 has no clang++.
# This g++ ships libstdc++ and links it. macOS uses the image clang++.
"conda:gxx" = { version = "16.2.0", os = ["linux"] }
wasmtime = "latest"

# The conda package ships ar as `<target>-ar` only. build.rs calls `ar`.
[tools.clang]
version = "18.1.3"
os = ["linux"]
postinstall = { run = '''
set -eu
ar=$(find "$MISE_TOOL_INSTALL_PATH/bin" -type f -name '*-ar' -print -quit)
test -n "$ar"
ln -sfn "$ar" "$MISE_TOOL_INSTALL_PATH/.mise-bins/ar"
''', when = "always" }

[env]
LIBCLANG_PATH = { value = "{% if os() == 'linux' %}{{ tools.libclang.path }}/lib{% endif %}", tools = true }

# Fetch liburing on `mise install`, including when the tools are already installed.
[hooks.postinstall]
run = '''
if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
  git submodule sync
  git submodule update --init
fi
'''
run_windows = "git rev-parse --is-inside-work-tree >NUL 2>&1 && git submodule sync && git submodule update --init"

# One command surface. Local and GitHub run these tasks.
# A failed task fails the job.
#
# Pull request and main: no-debug-assert, ci, ffi (Linux and macOS),
# and mutants-diff (pull requests).
# ci runs each check once, in this order: fmt, check, check-clean, clippy,
# cargo deny, then test. lint depends on fmt, check, and clippy, then runs
# cargo deny. wait_for puts check-clean between check and clippy, and test
# after lint, without running those tasks a second time.
# Windows skips check-clean.
# Nightly: search, miri, mutants.
# Release: test, then release, then publish.
# Publish tokens are only on the publish step.

[tasks.fmt]
description = "Fail if rustfmt would change a file."
run = "cargo fmt --check"

[tasks.check]
description = "Type-check every target. Skip lio-uring off Linux. Skip busybox on Windows."
# After fmt when both are in the same run. mise run check does not run fmt.
wait_for = ["fmt"]
env = { RUSTFLAGS = "-Dwarnings" }
run = "cargo check --workspace --all-targets{% if os() != 'linux' %} --exclude lio-uring{% endif %}{% if os() == 'windows' %} --exclude busybox --features lio/high{% else %} --all-features{% endif %}"

[tasks.check-clean]
description = "On Linux, a second cargo check must compile nothing. Same flags as check."
# After check when both are in the same run.
wait_for = ["check"]
env = { RUSTFLAGS = "-Dwarnings" }
# Windows starts a TOML command with cmd, which cannot run this bash script.
# An empty list skips the task there.
run = "scripts/check-clean.sh"
run_windows = []

[tasks.clippy]
description = "Clippy, with the same packages and features as check."
# After check-clean when both are in the same run, so clippy cannot rebuild
# between the two checks. mise run clippy does not run check-clean.
wait_for = ["check-clean"]
env = { RUSTFLAGS = "-Dwarnings" }
run = "cargo clippy --workspace --all-targets{% if os() != 'linux' %} --exclude lio-uring{% endif %}{% if os() == 'windows' %} --exclude busybox --features lio/high{% else %} --all-features{% endif %}"

[tasks.test]
description = "Library and integration tests with high, plus doctests. Includes this OS's backends."
# After lint when both are in the same run. mise run test does not run lint.
wait_for = ["lint"]
env = { RUSTFLAGS = "-Dwarnings" }
run = [
  "cargo test -p lio --features high --tests",
  "cargo test --doc -p lio -p lio-test{% if os() == 'windows' %} --features lio/high{% else %} --all-features{% endif %}",
]

[tasks.no-debug-assert]
description = "Reject debug_assert!. It is compiled out of release builds."
run = "scripts/no-debug-assert.sh"

[tasks.mutants-diff]
description = "Fail if a mutant in the diff survives. CI sets GITHUB_BASE_REF. Locally set BASE."
run = "scripts/mutants-diff.sh"

[tasks.search]
description = "Model and lifecycle tests at the nightly sizes."
env = { PROPTEST_CASES = "20000", LIO_LIFECYCLE_DEPTH = "8" }
run = "cargo test -p lio --release --lib -- model lifecycle"

[tasks.miri]
description = "Core bookkeeping under Miri. Honors SEED, BORROWS, MIRIFLAGS, and SHARD."
run = "scripts/test-miri.sh"

[tasks.mutants]
description = "Every core mutant from .cargo/mutants.toml. Set SHARD=k/n for one slice."
run = "scripts/mutants.sh"

[tasks.ffi]
description = "Build the C ABI, then compile and run the C and C++ tests. Linux uses the mise g++. macOS uses clang++."
run = "scripts/test-ffi.sh"

[tasks.ci]
description = "Pull-request checks for this OS. fmt, check, clippy, and cargo deny run once through lint. check-clean and test run once too."
depends = ["check-clean", "lint", "test"]

[tasks.lint]
description = "fmt, check, clippy, then cargo-deny."
depends = ["fmt", "check", "clippy"]
run = "cargo deny check"

[tasks.bench]
description = "Bookkeeping (no kernel I/O), then each real backend"
run = [
  "cargo bench -p lio --bench bookkeeping",
  "cargo bench -p lio --bench backends",
]

[tasks.cbuild]
description = "Build the C ABI as a release dylib and staticlib."
run = "cargo rustc -p lio --crate-type dylib,staticlib --features unstable_ffi --release"

[tasks.release]
description = "Bump, tag, and push. Set BUMP to patch, minor, or major. Run test first."
run = "scripts/release.sh"

[tasks.publish]
description = "Create the GitHub release and publish lio-uring, then lio. Run release first."
run = "scripts/publish.sh"
