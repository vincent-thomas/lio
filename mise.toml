[tools]
rust = [
  { version = "1.100.0", profile = "minimal", components = "clippy,rust-src,rustfmt" },
  { version = "nightly", profile = "minimal", components = "miri,rust-src" },
]
"cargo:cargo-deny" = "latest"
"cargo:cargo-mutants" = "latest"
cmake = "3.28.3"
jq = "1.7.1"

[tools."conda:libclang"]
version = "18.1.3"
os = ["linux"]
postinstall = { run = '''
set -eu
printf 'LIBCLANG_PATH=%s\n' "$MISE_TOOL_INSTALL_PATH/lib" > "$MISE_TOOL_INSTALL_PATH/libclang.env"
''', when = "always" }

# Linux only. lio-uring calls `clang` and `ar` by name, and bindgen loads
# libclang. conda's clang package exposes ar only as a target-prefixed
# binary, so publish a plain `ar`.
[tools.clang]
version = "18.1.3"
os = ["linux"]
postinstall = { run = '''
set -eu
bins="$MISE_TOOL_INSTALL_PATH/.mise-bins"
ar=$(find "$MISE_TOOL_INSTALL_PATH/bin" -type f -name '*-ar' -print -quit)
test -n "$ar"
printf '%s\n' '#!/bin/sh' "exec '$ar' \"\$@\"" > "$bins/ar"
chmod +x "$bins/ar"
''', when = "always" }

[env]
# Written by the libclang postinstall. Off Linux the path is empty and mise skips it.
_.file = { path = "{% if os() == 'linux' %}{{ tools.libclang.path }}/libclang.env{% endif %}", tools = true }

# liburing is an SSH submodule. Fetch it over HTTPS during `mise install`,
# including when the tools are already installed. Skip trees that are not a git checkout.
[hooks.postinstall]
run = '''
if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
  git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init
fi
'''
run_windows = "git rev-parse --is-inside-work-tree >NUL 2>&1 && git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init"

[tasks.lint]
run = [
  "cargo fmt --check",
  "cargo check --all-features",
  "cargo clippy --all-features",
  "cargo deny check"
]

[tasks.cbuild]
run = "cargo rustc -p lio --crate-type dylib,staticlib --features unstable_ffi --release"
