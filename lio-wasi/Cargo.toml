[package]
name = "lio-wasi"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "WASI 0.3 through the component model's async built-ins, without an executor"
repository = "https://github.com/vincent-thomas/lio"
documentation = "https://docs.rs/lio-wasi"
keywords = ["wasi", "async", "io", "wasm", "component-model"]
categories = ["asynchronous", "wasm", "network-programming"]
readme = "README.md"

[package.metadata.docs.rs]
default-target = "wasm32-wasip3"
targets = ["wasm32-wasip3"]

[dependencies]
wasip3 = "0.10.0"
