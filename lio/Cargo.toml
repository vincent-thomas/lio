[package]
name = "lio"
version = "0.4.1"
edition = "2024"
description = "A platform-independent async I/O library with native support for io_uring (Linux), IOCP (Windows), and kqueue (macOS)"
license = "MIT"
repository = "https://github.com/vincent-thomas/lio"
documentation = "https://docs.rs/lio"
keywords = ["async", "io", "networking", "filesystem"]
categories = ["asynchronous", "network-programming", "filesystem"]
authors = ["Vincent Thomas <vincent@v-thomas.com>"]
build = "build.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["backend_impls"]
nightly = []
unstable_ffi = ["dep:cbindgen"]
high = []
backend_impls = ["dep:lio-uring"]

[dependencies]

# Required
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
lio-uring = { path = "../lio-uring", version = "0.3.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_IO",
  "Win32_System_Threading",      # CreateTimerQueueTimer, DeleteTimerQueueTimer, GetCurrentProcess, DuplicateHandle
  "Win32_System_Console",        # GetStdHandle, STD_*_HANDLE
  "Win32_Storage_FileSystem",    # ReadFile, WriteFile, CreateFileW
  "Win32_Networking_WinSock",    # WSARecv, WSASend, AcceptEx, ConnectEx
  "Win32_Security",              # Security attributes for file operations
] }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false, optional = true }

[dev-dependencies]
pastey = { version = "0.1" }
proptest = { version = "1.4", default-features = false, features = ["std"] }
