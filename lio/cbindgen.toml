language = "C"
include_guard = "LIO_H"
cpp_compat = true
autogen_warning = "/* THIS FILE IS AUTO-GENERATED BY cbindgen — DO NOT EDIT MANUALLY */"
no_includes = true

after_includes = """
#include <stddef.h>
#include <stdint.h>
#include <sys/socket.h>
#ifndef __cplusplus
typedef struct sockaddr sockaddr;
typedef struct sockaddr_storage sockaddr_storage;
#endif
"""

[export]
# The C API documents its own bound (`INT64_MAX`) on the functions that take
# file offsets; keep the backend contract's constant out of the C namespace.
exclude = ["MAX_FILE_OFFSET"]

[parse]
parse_deps = false
