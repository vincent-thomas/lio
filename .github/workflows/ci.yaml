name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  nix-check:
    name: nix-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/flake-checker-action@main
      - name: nix flake check
        run: nix flake check '.?submodules=1&shallow=0'

  check:
    name: check-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: --workspace
            features: --all-features
          # lio-uring is Linux-only.
          - os: macos-latest
            packages: --workspace --exclude lio-uring
            features: --all-features
          # busybox is a Unix coreutils clone and `unstable_ffi` is a C ABI
          # built on POSIX types; neither targets Windows.
          - os: windows-latest
            packages: --workspace --exclude lio-uring --exclude busybox
            features: --features lio/high
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: DeterminateSystems/nix-installer-action@main
        if: runner.os == 'Linux'

      # Installs rustup; rust-toolchain.toml selects the toolchain.
      - uses: dtolnay/rust-toolchain@stable

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check
        run: cargo check ${{ matrix.packages }} --all-targets ${{ matrix.features }}

      - name: cargo doc
        run: cargo test --doc -p lio -p lio-test ${{ matrix.features }}

      - name: cargo clippy
        run: cargo clippy ${{ matrix.packages }} --all-targets ${{ matrix.features }}

      - name: bookkeeping tests
        run: cargo test -p lio --lib

      - name: integration tests
        run: cargo test -p lio --features high --test '*'

  miri:
    name: miri-${{ matrix.borrows }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - borrows: stacked
            flags: ""
          - borrows: tree
            flags: -Zmiri-tree-borrows
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: miri (core bookkeeping)
        env:
          MIRIFLAGS: ${{ matrix.flags }}
          # Nightly adds lints before stable has them.
          RUSTFLAGS: ""
        run: scripts/test-miri.sh

  mutants:
    name: mutants
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      # Installs rustup; rust-toolchain.toml selects the toolchain.
      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest

      # Every mutant of a changed line in the core must make a test fail;
      # `.cargo/mutants.toml` says which files count as core.
      - name: mutate the lines this PR changes
        env:
          NEXTEST_PROFILE: mutants
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > pr.diff
          # A mutant can loop while allocating: cap each process's address
          # space (8 GiB) so that test fails instead of the runner dying.
          ulimit -v 8388608
          cargo mutants --in-diff pr.diff --no-shuffle --jobs 2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-out
          path: mutants.out

  test-backend:
    name: backend-${{ matrix.backend }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - backend: io_uring
            os: ubuntu-latest
            test_filter: io_uring
          - backend: poller
            os: ubuntu-latest
            test_filter: poller
          - backend: poller
            os: macos-latest
            test_filter: poller
          - backend: iocp
            os: windows-latest
            test_filter: iocp

    needs: [check, nix-check]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Installs rustup; rust-toolchain.toml selects the toolchain.
      - uses: dtolnay/rust-toolchain@stable

      - name: test backend
        run: cargo test -p lio --test backends ${{ matrix.test_filter }}
