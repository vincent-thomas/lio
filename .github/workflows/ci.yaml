name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  nix-check:
    name: nix-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/flake-checker-action@main
      - name: nix flake check
        run: nix flake check '.?submodules=1&shallow=0'

  rust-check:
    name: rust-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: cargo doc
        run: cargo test --doc -p lio -p lio-test --all-features

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features

  test-bookkeeping:
    name: test-bookkeeping
    runs-on: ubuntu-latest
    needs: [rust-check, nix-check]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1

      - name: bookkeeping tests
        run: cargo test -p lio --lib

  test-backend:
    name: backend-${{ matrix.backend }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - backend: io_uring
            os: ubuntu-latest
            test_filter: io_uring
          - backend: poller
            os: ubuntu-latest
            test_filter: poller
          - backend: poller
            os: macos-latest
            test_filter: poller

    needs: [rust-check, nix-check]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1

      - name: test backend
        run: cargo test -p lio --test backends ${{ matrix.test_filter }}

  # TODO: test-backend-windows

  valgrind-leaks:
    name: valgrind-poller-leaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build and locate the Poller test executable
        id: test-bin
        shell: bash
        run: |
          set -euo pipefail
          messages=$(mktemp)
          trap 'rm -f "$messages"' EXIT
          cargo test --locked -p lio --test valgrind_poller --no-run --message-format=json > "$messages"
          python3 - "$messages" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              artifacts = [message["executable"] for line in stream
                           if (message := json.loads(line)).get("reason") == "compiler-artifact"
                           and message["target"]["name"] == "valgrind_poller"
                           and "test" in message["target"]["kind"]
                           ]
          if len(artifacts) != 1 or not artifacts[0] or not os.path.isfile(artifacts[0]) or not os.access(artifacts[0], os.X_OK):
              sys.exit(f"Expected exactly one executable valgrind_poller artifact, got {artifacts!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"path={artifacts[0]}", file=output)
          PY

      - name: Assert the named Linux test exists
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.test-bin.outputs.path }}" --list | grep -Fx 'leak_poller_roundtrip: test'

      - name: Check definite and indirect leaks
        shell: bash
        run: |
          set -euo pipefail
          valgrind --leak-check=full --errors-for-leak-kinds=definite,indirect --error-exitcode=1 \
            "${{ steps.test-bin.outputs.path }}" --exact leak_poller_roundtrip --nocapture
