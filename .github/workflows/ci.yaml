name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  nix-check:
    name: nix-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/flake-checker-action@main
      - name: nix flake check
        run: nix flake check '.?submodules=1&shallow=0'

  check:
    name: check-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: --workspace
            features: --all-features
          # lio-uring is Linux-only.
          - os: macos-latest
            packages: --workspace --exclude lio-uring
            features: --all-features
          # busybox is a Unix coreutils clone and `unstable_ffi` is a C ABI
          # built on POSIX types; neither targets Windows.
          - os: windows-latest
            packages: --workspace --exclude lio-uring --exclude busybox
            features: --features lio/high
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: DeterminateSystems/nix-installer-action@main
        if: runner.os == 'Linux'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check
        run: cargo check ${{ matrix.packages }} --all-targets ${{ matrix.features }}

      - name: cargo doc
        run: cargo test --doc -p lio -p lio-test ${{ matrix.features }}

      - name: cargo clippy
        run: cargo clippy ${{ matrix.packages }} --all-targets ${{ matrix.features }}

      - name: bookkeeping tests
        run: cargo test -p lio --lib

      - name: ops tests
        run: cargo test -p lio --features high --test ops

  test-backend:
    name: backend-${{ matrix.backend }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - backend: io_uring
            os: ubuntu-latest
            test_filter: io_uring
          - backend: poller
            os: ubuntu-latest
            test_filter: poller
          - backend: poller
            os: macos-latest
            test_filter: poller
          - backend: iocp
            os: windows-latest
            test_filter: iocp

    needs: [check, nix-check]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1

      - name: test backend
        run: cargo test -p lio --test backends ${{ matrix.test_filter }}
