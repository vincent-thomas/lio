name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  nix-check:
    name: nix-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/flake-checker-action@main
      - name: nix flake check
        run: nix flake check '.?submodules=1&shallow=0'

  rust-check:
    name: rust-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: cargo doc
        run: cargo test --doc -p lio -p lio-test --all-features

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features

  test-bookkeeping:
    name: test-bookkeeping
    runs-on: ubuntu-latest
    needs: [rust-check, nix-check]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1

      - name: bookkeeping tests
        run: cargo test -p lio --lib

  test-backend:
    name: backend-${{ matrix.backend }}-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - backend: io_uring
            os: ubuntu-latest
            test_filter: io_uring
          - backend: poller
            os: ubuntu-latest
            test_filter: poller
          - backend: poller
            os: macos-latest
            test_filter: poller

    needs: [rust-check, nix-check]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1

      - name: test backend
        run: cargo test -p lio --test backends ${{ matrix.test_filter }}

  # TODO: test-backend-windows
