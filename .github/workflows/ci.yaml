name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache cargo registry
        uses: actions/cache@v4
        continue-on-error: false
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-build-cache

      - name: (main) Lint full
        if: github.ref == 'refs/heads/main'
        run: make lint-full

      - name: (not main) Lint
        if: github.ref != 'refs/heads/main'
        run: make lint

  lio-linux:
    name: lio linux tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/flake-checker-action@main

      - name: Cache cargo registry
        uses: actions/cache@v4
        continue-on-error: false
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-build-cache

      - name: test cbuild
        run: make test-ffi

      - name: nix build
        run: nix build '.?submodules=1'

      - name: test lio-uring
        run: make test-uring

  lio-build-n-test:
    name: Build n Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache cargo registry
        uses: actions/cache@v4
        continue-on-error: false
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-build-cache

      - name: (main) Run release tests
        if: github.ref == 'refs/heads/main'
        run: make test-release

      - name: (PR) Run debug tests
        if: github.ref != 'refs/heads/main'
        run: make test-debug

  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/flake-checker-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

  native-test:
    name: Native Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lio-build-n-test, lint]
    strategy:
      matrix:
        include:
          - os: macos-latest
            backend: kqueue
          - os: windows-latest
            backend: iocp
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: Run tests
        run: cargo nextest run -p lio --all-features --release

  vm-test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, lio-linux, lio-build-n-test, nix-flake-check]
    strategy:
      matrix:
        include:
          - name: Linux VM - io_uring
            vm: linux
          - name: FreeBSD VM - kqueue
            vm: freebsd
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Cache VM images
        uses: actions/cache@v4
        with:
          path: ~/.cache/lio-vm
          key: vm-${{ matrix.vm }}-${{ hashFiles(format('vm/{0}/run.sh', matrix.vm)) }}
          restore-keys: vm-${{ matrix.vm }}-

      - name: Run VM tests
        run: nix run .#${{ matrix.vm }}
