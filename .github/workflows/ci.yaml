name: CI

# Pull requests and main run the same mise tasks.
# A failed task fails the job.
on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  no-debug-assert:
    name: no-debug-assert
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Checked downloads. The action does not restore an install tree.
      # https://mise.jdx.dev/continuous-integration.html#trusted-cache
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mise/downloads-cas
          key: mise-downloads-${{ runner.os }}-${{ hashFiles('mise.lock') }}

      - uses: jdx/mise-action@v5
        with:
          version: "2026.11.12"
          cache: false

      - name: no-debug-assert
        run: mise run no-debug-assert

  ci:
    name: ci-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Checked downloads. The action does not restore an install tree.
      # https://mise.jdx.dev/continuous-integration.html#trusted-cache
      - uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && format('{0}\mise\downloads-cas', runner.temp) || runner.os == 'macOS' && '~/Library/Caches/mise/downloads-cas' || '~/.cache/mise/downloads-cas' }}
          key: mise-downloads-${{ runner.os }}-${{ hashFiles('mise.lock') }}

      - uses: jdx/mise-action@v5
        with:
          version: "2026.11.12"
          cache: false

      # fmt, check, check-clean, clippy, then test. Windows skips check-clean.
      - name: ci
        run: mise run ci

  # Slow, and still a merge gate: a mutant that survives in the diff fails CI.
  mutants:
    name: mutants
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      # Checked downloads. The action does not restore an install tree.
      # https://mise.jdx.dev/continuous-integration.html#trusted-cache
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mise/downloads-cas
          key: mise-downloads-${{ runner.os }}-${{ hashFiles('mise.lock') }}

      - uses: jdx/mise-action@v5
        with:
          version: "2026.11.12"
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants

      - name: mutants-diff
        run: mise run mutants-diff

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-out
          path: mutants.out
