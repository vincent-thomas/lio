name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        continue-on-error: false
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-release-cache

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run tests before release
        run: ./scripts/test.sh

      - name: Get old lio-uring version
        id: old_version
        run: |
          OLD_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lio-uring") | .version')
          echo "lio_uring=$OLD_VERSION" >> $GITHUB_OUTPUT

      - name: Bump versions
        run: |
          cargo set-version -p lio-uring --bump ${{ github.event.inputs.bump }}
          cargo set-version -p lio --bump ${{ github.event.inputs.bump }}

      - name: Get new version
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lio") | .version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update lio dependency on lio-uring
        run: |
          OLD="${{ steps.old_version.outputs.lio_uring }}"
          NEW="${{ steps.version.outputs.version }}"
          sed "/^lio-uring = /s/version = \"$OLD\"/version = \"$NEW\"/" lio/Cargo.toml > tmp && mv tmp lio/Cargo.toml

      - name: Commit release
        run: |
          git add lio/Cargo.toml lio-uring/Cargo.toml Cargo.lock
          git commit -m "release: v${{ steps.version.outputs.version }}"

      - name: Create tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"

      - name: Push commit
        run: |
          git push origin main

      - name: Push tag
        run: |
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish lio-uring to crates.io
        run: |
          cargo publish -p lio-uring
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io to index lio-uring
        run: sleep 30

      - name: Publish lio to crates.io
        run: |
          cargo publish -p lio
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
