name: Deep tests

# The searches CI runs small on every PR, run large: more random cases,
# deeper lifecycle orderings, Miri across many seeds, and every mutant of
# the core rather than only those in a diff.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  search:
    name: search
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Installs rustup; rust-toolchain.toml selects the toolchain.
      - uses: dtolnay/rust-toolchain@stable

      - name: model and lifecycle tests, large
        env:
          PROPTEST_CASES: "20000"
          LIO_LIFECYCLE_DEPTH: "8"
        run: cargo test -p lio --release --lib -- model lifecycle

  # One job per borrow model and seed, so they run side by side: one job
  # running every seed in turn took close to an hour.
  miri:
    name: miri-${{ matrix.borrows }}-seed-${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        borrows: [stacked, tree]
        # Each seed changes allocation addresses and scheduling choices.
        seed: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: miri (core bookkeeping)
        env:
          MIRIFLAGS: >-
            -Zmiri-seed=${{ matrix.seed }}
            ${{ matrix.borrows == 'tree' && '-Zmiri-tree-borrows' || '' }}
          PROPTEST_CASES: "16"
          # Each ordering is a fresh driver, so keep it shallow under Miri.
          LIO_LIFECYCLE_DEPTH: "2"
          RUSTFLAGS: ""
        run: scripts/test-miri.sh

  mutants:
    name: mutants-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Installs rustup; rust-toolchain.toml selects the toolchain.
      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest

      - name: every core mutant, shard ${{ matrix.shard }} of 8
        env:
          NEXTEST_PROFILE: mutants
        # A mutant can loop while allocating. Capping each process's address
        # space (8 GiB) makes that test fail instead of taking the runner down.
        run: |
          ulimit -v 8388608
          cargo mutants --shard ${{ matrix.shard }}/8 --no-shuffle --jobs 2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-out-${{ matrix.shard }}
          path: mutants.out
